events {}

http {

    server {
        listen 80;
        return 301 https://$host$request_uri;
    }

    server {
        listen 443 ssl;

        ssl_certificate /etc/nginx/certs/servidor.crt;
        ssl_certificate_key /etc/nginx/certs/servidor.key;

        add_header X-Hostname $hostname;

        location / {
            root /usr/share/nginx/html;
            index index.html;
        }
    }
}